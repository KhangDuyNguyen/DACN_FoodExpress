server:
  port: 8080

spring:
  application:
    name: food-delivery-backend
  config:
    # Doc file .env o thu muc goc. Chay tu thu muc backend (./mvnw) thi file nam o ../.env
    import: optional:file:./.env[.properties],optional:file:../.env[.properties]
  datasource:
    # Mac dinh khop voi docker-compose.yml o thu muc goc (MySQL root / change_me).
    url: ${DB_URL:jdbc:mysql://localhost:3306/fooddelivery?serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:change_me}
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Cho phep chay migration co so phien ban nho hon khi dong doi them file sau (tranh loi validate khi pull code)
    out-of-order: true

app:
  cors:
    allowed-origins: http://localhost:5173
  jwt:
    # Dat bien moi truong JWT_SECRET (>= 32 ky tu). KHONG commit gia tri that len Git.
    secret: ${JWT_SECRET:}
    expiration-minutes: 1440
  admin:
    # Tai khoan admin dau tien, chi tao khi ca hai bien co gia tri va chua co user ADMIN nao.
    phone: ${ADMIN_PHONE:}
    password: ${ADMIN_PASSWORD:}
  ai-service-url: ${AI_SERVICE_URL:http://localhost:8000}
