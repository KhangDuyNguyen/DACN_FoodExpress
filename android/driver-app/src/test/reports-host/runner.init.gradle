// Isolated UI fixture runner; no changes to production Gradle or dependencies.
allprojects { project ->
    project.pluginManager.withPlugin('com.android.application') {
        if (project.path == ':driver-app') {
            project.extensions.getByName('androidComponents').finalizeDsl { android ->
                android.defaultConfig.testInstrumentationRunner =
                    'vn.hutech.foodexpress.driver.report.DriverReportsUiInstrumentation'
            }
        }
    }
}
